<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<h2>Add Product</h2>

<form th:action="@{/save}" th:object="${product}" method="post">

    Name:
    <input type="text" th:field="*{name}">
    <br><br>

    Category:
    <input type="text" th:field="*{category}">
    <br><br>

    Price:
    <input type="number" step="0.01" th:field="*{price}">
    <br><br>

    Quantity:
    <input type="number" th:field="*{quantity}">
    <br><br>

    Available:
    <input type="checkbox" th:field="*{available}">
    <br><br>

    <button type="submit">
        Save
    </button>

</form>


</body>
</html>
